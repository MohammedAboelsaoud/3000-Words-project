  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }

  .brand { fill:var(--tinte); }
  .mid { fill:var(--band-2); }
  .deep { fill:var(--ink); }
  .hl { fill:var(--marker); }
  .blk { rx:var(--radius-lg); }
  .bar { fill:var(--paper); rx:var(--radius-sm); }
  .bar.hi { fill:var(--marker); }
  .words { position:absolute; left:var(--space-6); bottom:var(--space-6); max-width:440px; }
  .name { margin:0; font-family:var(--font-target); font-size:120px; line-height:.92; font-weight:600; letter-spacing:-.02em; color:var(--ink); }
